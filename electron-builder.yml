appId: com.mirxabot.app
productName: Mirxa Bot
artifactName: MirxaBot-${version}-${arch}.${ext}

# In-app auto-update reads latest-mac.yml + the .zip from this PUBLIC releases
# repo (separate from the source repo). Public → no token on users' machines.
# Baked into app-update.yml; `latest-mac.yml` is emitted here even with
# --publish never, and uploaded to the GitHub release alongside the artifacts.
publish:
  - provider: github
    owner: milind-soni
    repo: openmausbot-releases

directories:
  buildResources: build
  output: release

# The app is three self-contained pieces, none needing node_modules at
# runtime: the Electron main/preload (plain .mjs/.cjs), the built UI
# (Vite → ui/), and the compiled harness server (tsc → server/), both
# shipped in Resources and run on Electron's own Node via
# ELECTRON_RUN_AS_NODE (the agentcal-hq pattern).
files:
  - electron/**
  - "!electron/resources/speech-helper"
  - "!**/node_modules/**"
  - package.json

asar: true

# Strip macOS provenance/FinderInfo xattrs before codesign — extraction under
# an iCloud-synced or provenance-tracked path otherwise fails signing with
# "resource fork, Finder information, or similar detritus not allowed".
afterPack: scripts/after-pack.cjs

extraResources:
  - from: dist
    to: ui
  - from: dist-server
    to: server
  - from: electron/resources/speech-helper
    to: speech-helper

mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Mirxa Bot uses the microphone for voice dictation into the composer.
    NSSpeechRecognitionUsageDescription: Mirxa Bot transcribes your voice on-device to type messages for you.
  # Notarization runs manually after the build (notarytool + staple),
  # mirroring the BlueyLite ship_release.sh flow.
  notarize: false

dmg:
  sign: true
  artifactName: MirxaBot-${version}.dmg
